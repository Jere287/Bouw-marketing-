<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"Archivo";src:url(../../fonts/Archivo-100_900.woff2);font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:"Plex";src:url(../../fonts/IBMPlexSans-400.woff2);font-weight:400}
@font-face{font-family:"PlexMono";src:url(../../fonts/IBMPlexMono-500.woff2);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
.slide{position:relative;overflow:hidden;width:1080px;height:1350px;font-family:"Plex",sans-serif;color:#0d2947}
.abs{position:absolute}
.hd{font-family:"Archivo";font-weight:800;letter-spacing:-0.02em;line-height:1.02}
.tg{font-family:"Archivo";font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.tx{font-family:"Plex";line-height:1.38}
.mn{font-family:"PlexMono";font-weight:500}
.cream{background:#fbf6ea} .navy{background:#0d2947;color:#fff}
.or{color:#e87722} .cy{color:#4fd6e8}
.chip{position:absolute;font-family:"Archivo";font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:22px;padding:9px 20px;border-radius:40px}
.chip.hoy{background:#fbf6ea;color:#e87722;border:2.5px solid #e87722}
.chip.bouw{background:#0d2947;color:#4fd6e8;border:2.5px solid #4fd6e8}
.ph{position:absolute;border-radius:14px;overflow:hidden;background-size:cover}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body><section class="slide">
<div class="abs cream" style="left:0;top:0;width:1080px;height:720px"></div>
<div class="abs navy" style="left:0;top:720px;width:1080px;height:630px"></div>
<img class="abs" src="logo-oscuro.png" style="left:70px;top:30px;width:150px;height:79px">
<div class="abs hd" style="left:70px;top:118px;width:940px;font-size:62px">La auditoría llega.<br><span class="or">¿Tu carpeta está lista?</span></div>
<div class="ph" style="left:70px;top:262px;width:940px;height:440px"><img src="cump-antes.png" style="object-position:center 40%"></div>
<div class="chip hoy" style="left:94px;top:284px">Hoy</div>
<div class="ph" style="left:70px;top:738px;width:940px;height:420px;border:2px solid #4fd6e8"><img src="cump-despues.png" style="object-position:center 40%"></div>
<div class="chip bouw" style="left:94px;top:760px">Con BOUW</div>
<div class="abs" style="left:70px;top:1190px;width:300px"><div class="hd cy" style="font-size:44px;white-space:nowrap">33→100 %</div><div class="tx" style="font-size:19px;color:#c6d4e4;margin-top:6px">preparación para inspección</div></div><div class="abs" style="left:390px;top:1190px;width:300px"><div class="hd cy" style="font-size:44px;white-space:nowrap">9 → 0</div><div class="tx" style="font-size:19px;color:#c6d4e4;margin-top:6px">CAPA abiertas</div></div><div class="abs" style="left:710px;top:1190px;width:300px"><div class="hd cy" style="font-size:44px;white-space:nowrap">3 → 0</div><div class="tx" style="font-size:19px;color:#c6d4e4;margin-top:6px">lotes retenidos</div></div>
<div class="abs mn" style="left:70px;top:1292px;width:940px;font-size:19px;color:#8fa8c4">Planta de ejemplo (ilustrativo). Informe de auditoría BPM simulado.</div>
</section></body></html>
